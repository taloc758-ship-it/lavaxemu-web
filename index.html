<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文曲星游戏馆 - LavaX Web (WASM)</title>
<style>
  body { background:#1b1b1f; color:#ddd; font-family:system-ui,"Microsoft YaHei"; display:flex; flex-direction:column; align-items:center; margin:0; padding:16px 10px; touch-action:manipulation; overscroll-behavior:none; }
  h2 { margin:0 0 10px; font-weight:600; font-size:20px; }
  h2 small { font-size:12px; color:#888; font-weight:400; }
  canvas { image-rendering: pixelated; width:640px; max-width:96vw; background:#000; border:1px solid #444; border-radius:4px; }
  .bar { margin:12px 0 6px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center; }
  button { background:#2d2d34; color:#ddd; border:1px solid #555; padding:6px 14px; border-radius:6px; cursor:pointer; font-size:13px; font-family:inherit; }
  button:hover { background:#3a3a44; }
  #status { color:#9c9; font-size:14px; min-height:20px; text-align:center; }
  #gamelist { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; max-width:720px; width:96vw; margin:14px 0; }
  #gamelist button { padding:12px 8px; font-size:15px; background:#26262d; }
  #gamelist button .badge { display:block; font-size:11px; color:#777; margin-top:4px; }
  .keys { font-size:12px; color:#888; max-width:660px; text-align:center; line-height:1.8; }
  .hidden { display:none !important; }

  /* 虚拟手柄 */
  #gamepad { display:flex; gap:22px; margin:12px 0 4px; align-items:center; justify-content:center; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  #dpad { display:grid; grid-template-columns:repeat(3, 58px); grid-template-rows:repeat(3, 58px); gap:5px; }
  .pad, .act, .ext { background:#2d2d34; color:#ddd; border:1px solid #555; border-radius:10px; font-size:17px; touch-action:none; -webkit-tap-highlight-color:transparent; display:flex; align-items:center; justify-content:center; padding:0; }
  .pad.active, .act.active, .ext.active { background:#54588a; border-color:#98a0ff; }
  .pad.up    { grid-area:1/2; }
  .pad.left  { grid-area:2/1; }
  .pad.right { grid-area:2/3; }
  .pad.down  { grid-area:3/2; }
  #actions { display:grid; grid-template-columns:repeat(2, 76px); gap:8px; }
  .act { height:52px; font-size:14px; }
  .act.enter { background:#33502f; }
  .act.back  { background:#503434; }
  #extpad { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:440px; margin:8px auto 0; user-select:none; -webkit-user-select:none; }
  .ext { width:60px; height:42px; font-size:13px; }
  @media (hover: hover) and (pointer: fine) { body.hasmouse #gamepad, body.hasmouse #extpad { opacity:.85; } }
</style>
</head>
<body>
<h2>文曲星游戏馆 <small>LavaX Web · WASM（含定时器 / 机型签名等修复）</small></h2>

<div id="screenwrap" class="hidden">
  <canvas id="screen" width="160" height="80"></canvas>

  <div id="gamepad">
    <div id="dpad">
      <button class="pad up"    data-code="20">▲</button>
      <button class="pad left"  data-code="23">◀</button>
      <div></div>
      <button class="pad right" data-code="22">▶</button>
      <button class="pad down"  data-code="21">▼</button>
    </div>
    <div id="actions">
      <button class="act enter" data-code="13">确定</button>
      <button class="act back"  data-code="27">返回</button>
      <button class="act back"  data-code="14">翻页↓</button>
      <button class="act back"  data-code="19">翻页↑</button>
    </div>
  </div>

  <div id="extpad" class="hidden">
    <button class="ext" data-code="98">1·B</button>
    <button class="ext" data-code="110">2·N</button>
    <button class="ext" data-code="109">3·M</button>
    <button class="ext" data-code="103">4·G</button>
    <button class="ext" data-code="104">5·H</button>
    <button class="ext" data-code="106">6·J</button>
    <button class="ext" data-code="116">7·T</button>
    <button class="ext" data-code="121">8·Y</button>
    <button class="ext" data-code="117">9·U</button>
    <button class="ext" data-code="28">F1</button>
    <button class="ext" data-code="29">F2</button>
    <button class="ext" data-code="30">F3</button>
    <button class="ext" data-code="31">F4</button>
    <button class="ext" data-code="26">Shift</button>
  </div>

  <div class="bar">
    <button id="back">← 游戏列表</button>
    <button id="reset">复位 (F10)</button>
    <button id="clearsave">清除存档</button>
    <button id="padtoggle">显示扩展键</button>
    <label style="font-size:13px">速度
      <select id="speed" style="background:#2d2d34;color:#ddd;border:1px solid #555;border-radius:6px;padding:5px;font-size:13px">
        <option value="0.5">0.5×</option>
        <option value="0.75">0.75×</option>
        <option value="1" selected>1×</option>
        <option value="1.5">1.5×</option>
        <option value="2">2×</option>
        <option value="3">3×</option>
      </select>
    </label>
  </div>
</div>

<div id="status"></div>
<div id="gamelist"></div>

<div class="keys" id="help">
  方向键 移动 · Enter 确认 · Esc / 退格 返回 · 空格 = B · 数字键 1-9 = B/N/M/G/H/J/T/Y/U · F1-F4 功能键<br>
  手机使用屏幕按键，支持多点触控 · 每个游戏的存档独立保存在浏览器 localStorage
</div>
<script type="module" src="app.js"></script>
</body>
</html>
